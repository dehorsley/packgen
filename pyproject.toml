[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "packgen"
dynamic = ['version']
description = "A tool to generate C struct packing and unpacking routines"
authors = [{ name = "David Horsley", email = "david.e.horsley@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
# Capped deliberately. The tree-sitter Python API has had a breaking
# change within a minor before -- Language(path, "c") plus
# set_language() became Language(tree_sitter_c.language()) plus
# Parser(lang) at 0.22 -- and that is exactly the call packgen makes.
# An uncapped floor turns the next such change into a broken install for
# anyone doing a fresh pip install. Raise the cap deliberately, with
# test_parser_constructs_against_the_installed_tree_sitter to back it.
dependencies = [
    "tree-sitter>=0.23,<0.27",
    "tree-sitter-c>=0.23,<0.25",
]

[project.scripts]
packgen = "packgen.__main__:main"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["packgen*"]

[tool.setuptools.package-data]
packgen = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The tools add the repo root to sys.path before importing from it.
"tools/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["packgen"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Used by the test that checks the installed deps match the pins.
    # It arrives with pytest anyway; declared so that stays deliberate.
    "packaging>=23",
    # Locked rather than run through uvx, so a new ruff or mypy release
    # cannot fail CI on a day nobody touched the code, and so a local
    # `uv run mypy` checks with the same version CI does.
    "mypy>=1.15",
    "ruff>=0.14",
]
